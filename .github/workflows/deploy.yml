name: 프론트엔드 S3 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: S3에 배포
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
      VITE_PORTONE_CHANNEL_KEY: ${{ vars.VITE_PORTONE_CHANNEL_KEY }}
      VITE_PORTONE_NOTICE_URL: ${{ vars.VITE_PORTONE_NOTICE_URL }}

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 운영 빌드
        run: npm run build

      - name: 배포 설정 확인
        run: |
          test -n "$AWS_REGION"
          test -n "$S3_BUCKET_NAME"

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3에 배포
        run: aws s3 sync dist "s3://$S3_BUCKET_NAME" --delete
